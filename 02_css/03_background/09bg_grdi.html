<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그라데이션 배경</title>
  <style>
    div {
      width: 500px;
      height: 500px;
      margin: 10px;
    }

    .gr1 {
      background:
        linear-gradient(126deg, color-mix(in oklch, #ff8a1e 18%, white), transparent 62%),
        radial-gradient(ellipse at 20% 30%, #ff8a1e 0 18%, transparent 52%),
        radial-gradient(ellipse at 78% 42%, #ffe2a6 0 20%, transparent 56%),
        linear-gradient(180deg, color-mix(in oklch, #ffe2a6 38%, white), color-mix(in oklch, #ff8a1e 24%, black));
    }

    .gr2 {
      background: linear-gradient(150deg, #ff8a1e 0%, #ffe2a6 100%);
    }

    .gr3 {background: conic-gradient(from 150deg at 50% 50%, #ff8a1e 0 0%, #ffe2a6 100%, #ff8a1e 100%)}

    .gr4 {background-color: #ffe2a6;
  background-image:
    radial-gradient(circle at 50% 50%, #ff8a1e 0% 18%, transparent 34%),
    radial-gradient(circle at 82% 18%, color-mix(in oklch, #ff8a1e 48%, white) 0 16%, transparent 32%),
    radial-gradient(circle at 72% 76%, #ffe2a6 0 18%, transparent 36%),
    radial-gradient(circle at 24% 82%, color-mix(in oklch, #ffe2a6 55%, black) 0 16%, transparent 34%);
  background-blend-mode: screen, normal, multiply, normal;}

    .gr5 { background-color: #ffe2a6;
  background-image:
    radial-gradient(circle at 14% 18%, #ff8a1e 0 14%, transparent 36%),
    radial-gradient(circle at 82% 16%, #22d3ee 0 16%, transparent 40%),
    radial-gradient(circle at 64% 82%, #fef3c7 0 18%, transparent 44%),
    radial-gradient(circle at 26% 76%, color-mix(in oklch, #ffe2a6 72%, black) 0 18%, transparent 42%),
    radial-gradient(circle, rgba(255,255,255,.18) 0 1px, transparent 1px),
    conic-gradient(from 150deg at 50% 50%, #ff8a1e, #22d3ee, #ffe2a6, #fef3c7, #ff8a1e);
  background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 16px 16px, 100% 100%;
  background-blend-mode: screen, lighten, overlay, multiply, soft-light, normal;}
  .gr6{
     background-color: #ffe2a6;
  background-image:
    radial-gradient(circle at 16% 18%, color-mix(in oklch, #ff8a1e 82%, white) 0 16%, transparent 36%),
    radial-gradient(circle at 84% 22%, color-mix(in oklch, #ffe2a6 82%, black) 0 18%, transparent 42%),
    radial-gradient(circle at 50% 86%, color-mix(in oklch, #ff8a1e 46%, #ffe2a6) 0 20%, transparent 44%),
    linear-gradient(150deg, color-mix(in oklch, #ff8a1e 16%, white), color-mix(in oklch, #ffe2a6 26%, white));
  background-blend-mode: screen, multiply, normal, normal;
  }
  </style>
</head>

<body>
  <div class="gr1"></div>
  <div class="gr2"></div>
  <div class="gr3"></div>
  <div class="gr4"></div>
  <div class="gr5"></div>
  <div class="gr6"></div>
</body>

</html>
