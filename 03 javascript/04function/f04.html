<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test</title>
</head>

<body>
  <script>
    //prompt로 이름 받아 오기 (uName)

    //prompt로 나이 받아 오기 (uAge)

    //함수 printMsg(이름,나이) 선언 ->함수선언문

    //호출uName,uAge

    const uName = prompt('이름을 입력하세요', '김레온');
    const uAge = prompt('나이를 입력하세요', '49');

    function printMsg(Name, Age) {
      document.write(`학생이름 : <b>${Name}</b><br>`);
      document.write(`학생나이 : <b>${Age}</b><br>`);
    }
    printMsg(uName, uAge);
  </script>
</body>

</html>
