<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자바 스크립트 시작하기</title>
</head>
<body>
  <button type="button" class="alert">경고창</button>
  <button type="button" class="prompt">프롬프트</button>
  <button type="button" class="confirm">확인/취소</button>
  <button type="button" class="console">콘솔로그-개발자도구</button>
  <button type="button" class="document">바디전체바꾸기</button>
  <script>
    document.querySelector('.alert').onclick = function (){
      alert('경고창');
    }
    document.querySelector('.prompt').onclick = () => {
       let loveName = prompt('이름을 입력하세요','레온 케네디');
       console.log(loveName);
    }
    document.querySelector('.confirm').onclick = () =>{
    let a = confirm('자바스크립트 어렵죠?');
    console.log(a);
    if(a){
      console.log('어렵네요');
    }else{
      console.log('네 확실히요');
    }
    }
    document.querySelector('.document').onclick = () =>{
      document.write('<h2>아 진짜 엉뜨카냐고</h2>')
    }
  </script>
</body>
</html>
