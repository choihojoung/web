<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>첫 자바스트립트</title>
</head>
<body>
  <button type="button" onclick="alert('눌렀음?')">클릭하면 경고창</button>
  <button type="button" class="change_btn">글씨 바꾸기</button>
  <button type="button" class="reset_btn">전체 바꿈</button>
  <button type="button" id="out">외부스크립트</button>
  <button type="button" class="end_btn">종료</button>
  <button type="button" onclick="alert('아웅 어려워')">집갈래</button>
  <button type="button" class="again_btn">다시한번</button>
  <button type="button" id="back">슬쩍</button>
  <p class="change">뭘까요?</p>
  <script>
    // crtl+/ 한줄주석
    /* 
    alt + shoft + a 
    여러줄 주석
     */
    document.querySelector('.change_btn').onclick = () => {
      document.querySelector('.change').innerHTML = '<em>hello world</em>'
    }
  </script>
  <script>
    document.querySelector('.reset_btn').onclick = function(){
      document.write('<h1>진짜 너무너무 어렵다 엉카지</h1>')
    }
  </script>
  <script src="./js/01test.js">
  </script>

  <script>
    document.querySelector('.end_btn').onclick = function(){
    document.write('<h1>왜이리 어려울까 이걸 내가 한다고?;;</h1>')
  }
  </script>
  <script>
    document.querySelector('.again_btn').onclick = () => {
      document.querySelector('.again').innerHTML = '<em>좀만 하면 집 간다<br></em>'
    }
  </script>
  <script src="./js/00test.js">
  </script>
</body>
</html>
