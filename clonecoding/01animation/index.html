<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>애니메이션</title>
  <meta name="description" content="애니메이션 클론코딩 사이트" />
  <meta name="keywords" content="파비콘 생성기, OG 이미지, 메타태그, 웹폰트, 무료 복붙" />
  <meta name="author" content="최호정" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="img/img/favicon.ico" type="image/x-icon">
</head>

<body>
  <h1>FlowYulLab Motion Lab</h1>
  <p class="main_title">오늘의 흐름을 설계합니다</p>
  <section>
    <h2 class="ir">CSS 애니메이션 이미지들</h2>
    <article class="sky">
      <img src="img/img/flowyullab_sun.png" alt="해" class="sun">
      <img src="img/img/flowyullab_cloud_primary.png" alt="구름1" class="cloud1">
      <img src="img/img/flowyullab_cloud_secondary.png" alt="구름2" class="cloud2">
    </article><!-- //.sky -->
    <article class="town">
      <img src="img/img/flowyullab_orbit.png" alt="orbit" class="orbit">
      <img src="img/img/town_night.png" alt="town_night" class="town_night">    
      <img src="img/img/town_day.png" alt="town_day" class="town_day">    
    </article> <!-- //.town -->
    <article class="people">
      <img src="img/img/man.png" alt="man" class="man">
      <img src="img/img/family.png" alt="family" class="family">
    </article><!-- //.people -->
